# =============================================================================
# Gradle properties
# =============================================================================

# JVM args for the Gradle daemon
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=false
android.nonFinalResIds=false

# Kotlin
kotlin.code.style=official
kotlin.incremental=true

# Build performance
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=false

# Room / KSP
ksp.incremental=true

# Use Android Studio JBR (Java 21) to satisfy AGP 8.7.x requirement
# org.gradle.java.home=C\:\\Program Files\\Android\\Android Studio\\jbr

# ---------------------------------------------------------------------------
# TDLib API credentials.
# Replace these with your own values from https://my.telegram.org -> API
# development tools. They are read by app/build.gradle.kts into BuildConfig.
# ---------------------------------------------------------------------------
telegram.api.id=94575
telegram.api.hash=a3406de8d171bb422bb6ddf3bbd800e2

# ---------------------------------------------------------------------------
# Android SDK location (override if ANDROID_HOME is not exported).
# ---------------------------------------------------------------------------
# sdk.dir=C\:\\Users\\HP\\AppData\\Local\\Android\\Sdk

# ---------------------------------------------------------------------------
# Local TDLib dependency selector.
#   jitpack   -> com.github.tdlibx:td:1.8.56            (default, via JitPack)
#   maven     -> io.github.tdlib-android:core:0.1.1    (Maven Central mirror)
# Both artifacts expose the identical `org.drinkless.tdlib` Java API.
# ---------------------------------------------------------------------------
tdlib.source=jitpack
